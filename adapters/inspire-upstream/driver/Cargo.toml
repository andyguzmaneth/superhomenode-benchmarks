[package]
name = "inspire-upstream-driver"
version = "0.1.0"
edition = "2021"
publish = false

# The published crate's default features drag in axum/tokio/reqwest for its
# server binaries; we only need the protocol, so they are turned off.
[dependencies]
inspire = { version = "=0.2.0", default-features = false }
serde_json = "1.0"
bincode = "1.3"

[[bin]]
name = "inspire-upstream-bench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
